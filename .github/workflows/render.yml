name: Print the paper

on:
  push:
    branches: [main]
    paths:
      - content.yml
      - 'src/**'
      - 'templates/**'
      - 'fonts/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package*.json'
      - .github/workflows/render.yml
  schedule:
    - cron: '0 0 * * 1' # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Render this week's edition
        run: npm run render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain img README.md)" ]; then
            echo "Nothing new to print."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img README.md
          git commit -m "chore: print this week’s edition"
          git push
